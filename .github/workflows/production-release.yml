name: Production release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_run:
        description: Optional successful preview run (normally selected automatically)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Liam-Frost/Liam-Frost.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
      preview_run: ${{ steps.candidate.outputs.preview_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the exact preview candidate merged into main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = 'repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', repo + path], text=True))
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          requested = os.environ.get('PREVIEW_RUN', '')
          assert not requested or re.fullmatch('[0-9]+', requested), 'Invalid preview run ID'
          runs = [api('/actions/runs/' + requested)] if requested else api('/actions/workflows/preview-release.yml/runs?branch=dev&status=success&per_page=100')['workflow_runs']
          tree = git('rev-parse', os.environ['GITHUB_SHA'] + '^{tree}')
          candidate = None
          for run in runs:
              sha = run['head_sha']
              if not (run['conclusion'] == 'success' and run['status'] == 'completed' and run['head_branch'] == 'dev' and run['event'] in ['push', 'workflow_dispatch'] and run['path'] == '.github/workflows/preview-release.yml' and run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY'] and re.fullmatch('[a-f0-9]{40}', sha)):
                  continue
              if subprocess.run(['git', 'merge-base', '--is-ancestor', sha, os.environ['GITHUB_SHA']]).returncode:
                  continue
              if git('rev-parse', sha + '^{tree}') != tree:
                  continue
              artifacts = api('/actions/runs/' + str(run['id']) + '/artifacts')['artifacts']
              if not any(a['name'] == 'personal-home-release-' + sha and not a['expired'] for a in artifacts):
                  continue
              candidate = run
              break
          assert candidate, 'No retained successful preview bundle exactly matches this main commit. Finish preview and merge dev without additional changes.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + candidate['head_sha'] + '\npreview_run=' + str(candidate['id']) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Production approval\n\nCandidate: `' + candidate['head_sha'] + '`\n\n[Preview site](https://preview.twilightfrosty.com) · [Successful preview build](' + candidate['html_url'] + ')\n\nReview the preview, then choose **Review deployments → production → Approve and deploy**. This promotes the same immutable bundle; no rebuild.\n\nIf preview advances to another version before approval, deployment will stop safely.\n')
          PY

  migration-plan:
    name: Rehearse and describe database changes before approval
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    outputs:
      database_approval_required: ${{ steps.plan.outputs.database_approval_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.revision }}
      - name: Rehearse against production content and freeze preview acceptance
        id: plan
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/preview-plan-key"
          known="$RUNNER_TEMP/preview-plan-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known"
          python3 - <<'PY' > migration-input.json
          import json, os, pathlib
          root = pathlib.Path('apps/api/prisma/migrations')
          migrations = [{'name': p.name, 'sql': (p / 'migration.sql').read_text()} for p in sorted(root.iterdir()) if p.is_dir()]
          print(json.dumps({'revision': os.environ['REVISION'], 'migrations': migrations}))
          PY
          ssh -i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$SSH_USER@$SSH_HOST" "migration-plan $REVISION" < migration-input.json > migration-plan.json
          python3 - <<'PY'
          import json, os, pathlib
          p = json.loads(pathlib.Path('migration-plan.json').read_text())
          assert p['ok'] and p['rehearsal_passed'] and p['approval']['revision'] == os.environ['REVISION']
          risk = p['approval']['database_approval_required']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('database_approval_required=' + str(risk).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## 数据库迁移审批计划\n\n生产内容临时副本迁移演练：**通过**。生产数据库尚未修改。\n\n')
              out.write('计划 SHA256：`' + p['sha256'] + '`\n\n')
              out.write('预发布刷新及部署暂停至 `' + p['preview_freeze_expires_at'] + '`；发布结束后自动恢复。超过此时间请重新生成计划。\n\n')
              out.write('批准后：验证生产历史与本计划一致 → 配对备份、R2 回读及加拿大副本 → 暂停 API 写入 → Prisma migrate deploy → 发布同一镜像及区域前端。\n\n')
              out.write('迁移期间动态 API 短暂不可用。数据库不会自动回滚；恢复备份可能丢失备份后的写入。迁移失败或高风险迁移后发布失败会停住服务并要求人工恢复。\n\n')
              if not p['pending_sql']:
                  out.write('**没有待执行迁移**；沿用普通 production 审批。\n')
              for item in p['pending_sql']:
                  out.write('### `' + item['name'] + '`\n\n风险：**' + item['risk'] + '**。SHA256：`' + item['checksum'] + '`\n\n')
                  out.write('````sql\n' + item['sql'] + '\n````\n\n')
              if risk:
                  out.write('**额外数据库审批**：此计划超出“新增可空、无默认值字段”的保守允许范围。可能删数据、改类型、锁表或与旧版本不兼容；请逐条审阅 SQL。先批准 production-database，再批准 production。\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: production-migration-plan-${{ github.run_id }}
          path: migration-plan.json
          retention-days: 14
          if-no-files-found: error

  database-review:
    name: Additional review of potentially destructive database changes
    needs: migration-plan
    if: needs.migration-plan.outputs.database_approval_required == 'true'
    runs-on: ubuntu-24.04
    environment: production-database
    steps:
      - run: printf 'Database risk approved. Production approval is still required.\n' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [validate, migration-plan, database-review]
    if: always() && needs.validate.result == 'success' && needs.migration-plan.result == 'success' && (needs.database-review.result == 'success' || needs.database-review.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: https://www.twilightfrosty.com
    steps:
      - name: Download reviewed migration plan
        uses: actions/download-artifact@v8
        with:
          name: production-migration-plan-${{ github.run_id }}
          path: database-plan
      - name: Download the exact validated preview bundle
        uses: actions/download-artifact@v8
        with:
          name: personal-home-release-${{ needs.validate.outputs.revision }}
          path: release
          run-id: ${{ needs.validate.outputs.preview_run }}
          github-token: ${{ github.token }}
      - name: Verify immutable bundle hashes
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          PREVIEW_RUN: ${{ needs.validate.outputs.preview_run }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['revision'] == os.environ['REVISION']
          assert manifest['preview_run'] == int(os.environ['PREVIEW_RUN'])
          assert re.fullmatch('sha256:[a-f0-9]{64}', manifest['image_id'])
          assert set(manifest['files']) == {'image.tar.gz', 'public.tar.gz'}
          for name, expected in manifest['files'].items():
              assert hashlib.file_digest((root / name).open('rb'), 'sha256').hexdigest() == expected
          PY
      - name: Publish through restricted production gateway
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.validate.outputs.revision }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_RUN: ${{ github.run_id }}
          DATABASE_REVIEW: ${{ needs.database-review.result }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" || { echo 'main advanced while approval was pending; use its newer deployment.'; exit 1; }
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          key="$RUNNER_TEMP/production-release-key"
          known="$RUNNER_TEMP/production-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known"
          ssh-keygen -y -f "$key" > /dev/null
          ssh_options=(-i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('release/manifest.json')
          manifest = json.loads(p.read_text())
          manifest['production_run'] = int(os.environ['PRODUCTION_RUN'])
          manifest['approval_source'] = 'github-environment:production'
          plan = json.loads(pathlib.Path('database-plan/migration-plan.json').read_text())
          assert plan['ok'] and plan['approval']['revision'] == manifest['revision']
          manifest['migration_plan'] = {'approval': plan['approval'], 'sha256': plan['sha256'], 'expires_at': plan['preview_freeze_expires_at']}
          if plan['approval']['database_approval_required']:
              assert os.environ['DATABASE_REVIEW'] == 'success'
              manifest['database_approval_source'] = 'github-environment:production-database'
          p.write_text(json.dumps(manifest))
          PY
          cat release/manifest.json | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "authorize $REVISION"
          cat release/image.tar.gz | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-image $REVISION"
          cat release/public.tar.gz | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-public $REVISION"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "deploy $REVISION"
      - name: Verify production HTTPS
        run: |
          curl --fail --silent --show-error --retry 3 https://www.twilightfrosty.com/api/health
          printf 'Production published: https://www.twilightfrosty.com\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Record deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          printf '### Production deployment\n\nRevision: `%s`\n\nResult: **%s**\n\n[Open production](https://www.twilightfrosty.com)\n' "$REVISION" "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  resume-preview:
    name: Resume disposable preview after release
    needs: [validate, migration-plan, database-review, deploy]
    if: always() && needs.migration-plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - name: Release this candidate's acceptance pause
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/preview-resume-key"
          known="$RUNNER_TEMP/preview-resume-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known"
          ssh -i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "$SSH_USER@$SSH_HOST" "refresh-resume $REVISION"
