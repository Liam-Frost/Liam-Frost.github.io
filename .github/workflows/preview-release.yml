name: Preview release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A release is never cancelled halfway through migrations or replica publication.
concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  smoke:
    uses: ./.github/workflows/docker.yml

  deploy:
    name: Publish preview
    needs: [quality, smoke]
    if: github.repository == 'Liam-Frost/Liam-Frost.github.io' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: preview
      url: https://preview.twilightfrosty.com
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        env:
          REVISION: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$REVISION" -t "personal-home-preview:$REVISION" .
      - name: Extract public frontend
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          container=$(docker create --entrypoint /bin/sh "personal-home-preview:$REVISION")
          trap 'docker rm -v "$container" >/dev/null' EXIT
          mkdir -p public
          docker cp "$container:/app/apps/web/dist/." public/
      - name: Upload and release through restricted SSH gateway
        env:
          REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          key="$RUNNER_TEMP/preview-release-key"
          known="$RUNNER_TEMP/preview-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known"
          ssh-keygen -y -f "$key" > /dev/null
          ssh_options=(-i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          docker save "personal-home-preview:$REVISION" | gzip -1 | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-image $REVISION"
          tar -C public -czf - . | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-public $REVISION"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "deploy $REVISION"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 3 https://preview.twilightfrosty.com/api/health
          printf 'Preview published: https://preview.twilightfrosty.com\n' >> "$GITHUB_STEP_SUMMARY"
