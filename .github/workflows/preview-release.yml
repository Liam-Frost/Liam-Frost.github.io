name: Preview release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A release is never cancelled halfway through migrations or replica publication.
concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  smoke:
    uses: ./.github/workflows/docker.yml
    with:
      retain_secondary_image: true

  deploy:
    name: Publish preview
    needs: [quality, smoke]
    if: github.repository == 'Liam-Frost/Liam-Frost.github.io' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    environment:
      name: preview
      url: https://preview.twilightfrost.com
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        env:
          REVISION: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$REVISION" -t "personal-home-preview:$REVISION" .
      - name: Extract public frontend
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          container=$(docker create --entrypoint /bin/sh "personal-home-preview:$REVISION")
          trap 'docker rm -v "$container" >/dev/null' EXIT
          mkdir -p public
          docker cp "$container:/app/apps/web/dist/." public/
      - name: Upload and release through restricted SSH gateway
        env:
          REVISION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          key="$RUNNER_TEMP/preview-release-key"
          known="$RUNNER_TEMP/preview-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known"
          ssh-keygen -y -f "$key" > /dev/null
          ssh_options=(-i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          mkdir -p release
          docker save "personal-home-preview:$REVISION" | gzip -1 > release/image.tar.gz
          tar -C public -czf release/public.tar.gz .
          export RELEASE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "personal-home-preview:$REVISION")
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path('release')
          with tarfile.open(root / 'image.tar.gz', 'r:gz') as archive:
              images = json.load(archive.extractfile('manifest.json'))
              assert len(images) == 1
              config = archive.extractfile(images[0]['Config']).read()
              assert json.loads(config)['config']['Labels']['org.opencontainers.image.revision'] == os.environ['REVISION']
              image_id = 'sha256:' + hashlib.sha256(config).hexdigest()
          manifest = {'revision': os.environ['REVISION'], 'image_id': image_id, 'source_image_id': os.environ['RELEASE_IMAGE_ID'], 'preview_run': int(os.environ['GITHUB_RUN_ID']), 'files': {name: hashlib.file_digest((root / name).open('rb'), 'sha256').hexdigest() for name in ['image.tar.gz', 'public.tar.gz']}}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
          cat release/image.tar.gz | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-image $REVISION"
          cat release/public.tar.gz | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "upload-public $REVISION"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "deploy $REVISION"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 3 https://preview.twilightfrost.com/api/health
          printf 'Preview published: https://preview.twilightfrost.com\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove superseded preview bundles when production is idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = 'repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path, delete=False):
              cmd = ['gh', 'api', *( ['--method', 'DELETE'] if delete else [] ), repo + path]
              result = subprocess.check_output(cmd, text=True)
              return json.loads(result) if result.strip() else None
          active = [r for r in api('/actions/workflows/production-release.yml/runs?per_page=100')['workflow_runs'] if r['status'] != 'completed']
          if active:
              print('Production run active: preserve its artifact dependencies.')
          else:
              # The new preview is already deployed; old runs fail the promotion identity gate.
              artifacts = api('/actions/artifacts?per_page=100')['artifacts']
              for artifact in artifacts:
                  if re.fullmatch(r'personal-home-(release|manifest|secondary)-[a-f0-9]{40}', artifact['name']) and artifact.get('workflow_run', {}).get('head_branch') == 'dev' and artifact['workflow_run']['id'] != int(os.environ['GITHUB_RUN_ID']):
                      api('/actions/artifacts/' + str(artifact['id']), delete=True)
                      print('Removed superseded project artifact ' + str(artifact['id']))
          PY
      - name: Retain the exact validated release bundle
        uses: actions/upload-artifact@v7
        with:
          name: personal-home-release-${{ github.sha }}
          path: release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain the small promotion manifest
        uses: actions/upload-artifact@v7
        with:
          name: personal-home-manifest-${{ github.sha }}
          path: release/manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Summarize runner queue and execution times
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100"
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=25) as response:
              jobs = json.load(response)['jobs']
          def stamp(value):
              return datetime.datetime.fromisoformat(value.replace('Z', '+00:00')) if value else None
          def duration(seconds):
              seconds = max(0, int(seconds))
              return f'{seconds // 60}m {seconds % 60}s'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Runner queue and execution\n\nRunner queue is separate from build/deployment time. GitHub final status propagation is not included.\n\n| Job | Waiting for runner | Execution |\n| --- | ---: | ---: |\n')
              for job in jobs:
                  created, started = stamp(job.get('created_at')), stamp(job.get('started_at'))
                  if not created or not started:
                      continue
                  finished = stamp(job.get('completed_at')) or now
                  name = job['name'].replace('|', '/')
                  summary.write(f"| {name} | {duration((started-created).total_seconds())} | {duration((finished-started).total_seconds())} |\n")
          PY
