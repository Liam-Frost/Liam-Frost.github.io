name: Docker smoke test

# Builds the production image and runs the full stack (PostgreSQL + app + Caddy) end to end.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    inputs:
      retain_secondary_image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Smoke test
        run: bash docker/smoke-test.sh
        env:
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_IMAGE_ARCHIVE: ${{ inputs.retain_secondary_image && matrix.arch == 'arm64' && format('{0}/secondary-image.tar.gz', runner.temp) || '' }}
      - name: Identify tested image
        if: inputs.retain_secondary_image && matrix.arch == 'arm64'
        run: python3 .github/scripts/secondary_artifact.py write "$RUNNER_TEMP"
      - name: Retain tested image
        if: inputs.retain_secondary_image && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: personal-home-secondary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secondary-image.tar.gz
            ${{ runner.temp }}/secondary-manifest.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  smoke-gate:
    name: smoke
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Both amd64 and arm64 stack smoke tests passed.'
