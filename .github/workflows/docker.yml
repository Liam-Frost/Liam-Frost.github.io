name: Docker smoke test

# Builds the production image and runs the full stack (PostgreSQL + app + Caddy) end to end.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Smoke test
        run: bash docker/smoke-test.sh

  smoke-gate:
    name: smoke
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Both amd64 and arm64 stack smoke tests passed.'
