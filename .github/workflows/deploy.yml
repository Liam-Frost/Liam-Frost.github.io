name: Static emergency Pages
run-name: "Static emergency Pages${{ inputs.dry_run && ' [validation only]' || '' }}"

on:
  workflow_run:
    workflows: [Production release]
    types: [completed]
    branches: [main]
  schedule:
    # 06:37 Asia/Shanghai; refresh admin content even without a new code release.
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate a fresh snapshot without publishing
        type: boolean
        default: false
      force_publish:
        description: Publish even when content and resources are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'Liam-Frost/Liam-Frost.github.io' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      # Provisioned outside the repository: production publish/rollback exports a validated,
      # already-public frontend archive; Nginx serves only its descriptor and content hash URL.
      # The regional Worker sends /__emergency/ directly to the primary. No SSH key is used.
      - name: Snapshot actually deployed frontend and anonymous public data
        id: snapshot
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish || false }}
        run: |
          python3 - <<'PY'
          """Anonymous, bounded static snapshot builder. Embedded in the Pages workflow, no VPS secrets."""
          import datetime, hashlib, io, json, os, pathlib, re, tarfile, time, urllib.parse, urllib.request

          SOURCE = 'https://www.twilightfrosty.com'
          PAGES = 'https://liam-frost.github.io'
          MAX_TOTAL = 384*1024**2
          ROOT = pathlib.Path(os.environ['RUNNER_TEMP'])/'emergency-site'
          ALLOWED = {'.html','.js','.css','.svg','.png','.jpg','.jpeg','.webp','.avif','.ico','.woff','.woff2','.ttf','.txt','.json','.webmanifest','.mp3','.ogg'}
          total = 0
          last = 0.0

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Redirects are not allowed for snapshot source requests')

          opener = urllib.request.build_opener(NoRedirect())
          def fetch(url, limit=16*1024**2, database=False):
              global total,last
              # At most three serial requests per second; never log API response bodies.
              time.sleep(max(0, .35-(time.monotonic()-last)));last=time.monotonic()
              req = urllib.request.Request(url,headers={'User-Agent':'PersonalHome-Public-Snapshot/2','Cache-Control':'no-cache'})
              for attempt in range(3):
                  try:
                      with opener.open(req,timeout=30) as r:
                          assert not database or r.headers.get('x-snapshot-data-source')=='database', 'Source is seed/fallback data or requires a newer production release'
                          data=r.read(limit+1);assert len(data)<=limit
                          total+=len(data);assert total<=MAX_TOTAL
                          return data,r.headers.get('content-type','')
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==2: raise
                      time.sleep(2**attempt)

          def get(path, database=False): return json.loads(fetch(SOURCE+path, database=database)[0])
          def canonical(value): return json.dumps(value,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()
          def digest(value): return hashlib.sha256(value).hexdigest()
          def safe_name(name):
              p=pathlib.PurePosixPath(name)
              assert name and not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert not any(part.lower() in {'admin','api','.git','cname','.env','.analytics-geoip'} or part.startswith('.') and part != '.nojekyll' for part in p.parts)
              return p

          def build():
              assert not ROOT.exists();ROOT.mkdir()
              source=get('/__emergency/source.json')
              assert source['public_only'] is True and re.fullmatch('[a-f0-9]{40}',source['revision']) and re.fullmatch('[a-f0-9]{64}',source['sha256'])
              assert source['frontend_path']=='/__emergency/frontend/'+source['sha256']+'.tar.gz'
              blob=fetch(SOURCE+source['frontend_path'],64*1024**2)[0];assert digest(blob)==source['sha256']
              with tarfile.open(fileobj=io.BytesIO(blob),mode='r:gz') as archive:
                  members=archive.getmembers();assert 0<len(members)<=2000 and sum(m.size for m in members)<=128*1024**2
                  seen=set()
                  for member in members:
                      p=safe_name(member.name);assert member.isfile() or member.isdir()
                      assert p.as_posix() not in seen;seen.add(p.as_posix())
                      if member.isdir():continue
                      assert p.suffix.lower() in ALLOWED or p.name=='.nojekyll'
                      target=ROOT/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(archive.extractfile(member).read())
              paths=['/api/photos','/api/projects','/api/collection','/api/stack','/api/spotify/player','/api/contact','/api/about','/api/presentation']
              routes={path:get(path, database=path!='/api/spotify/player') for path in paths}
              for item in routes['/api/projects']:
                  ident=item['slug'];assert re.fullmatch('[A-Za-z0-9_-]{1,160}',ident)
                  path='/api/projects/'+ident;routes[path]=get(path)
              # Playlist metadata and track ids are already in /api/collection; no public detail route exists.
              for group,path in [('items','collection'),('people','people')]:
                  for item in routes['/api/collection'].get(group,[]):
                      ident=item['id'];assert re.fullmatch('[A-Za-z0-9_-]{1,100}',ident)
                      url='/api/'+path+'/'+ident;routes[url]=get(url)
              assert len(routes)<5000
              images=set()
              def scan(value):
                  if isinstance(value,dict):
                      for v in value.values():scan(v)
                  elif isinstance(value,list):
                      for v in value:scan(v)
                  elif isinstance(value,str) and value.startswith('/uploads/'):images.add(value)
              scan(routes)
              for url in sorted(images):
                  assert re.fullmatch('/uploads/[A-Za-z0-9_./-]+',url) and '..' not in pathlib.PurePosixPath(url).parts
                  data,kind=fetch(SOURCE+url);assert kind.startswith('image/')
                  target=ROOT/url.lstrip('/');target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              external={}
              for photo in routes['/api/photos']:
                  url=photo['src']
                  if url.startswith('/uploads/'):continue
                  parsed=urllib.parse.urlsplit(url)
                  assert parsed.scheme=='https' and parsed.hostname=='live.staticflickr.com' and parsed.port in (None,443) and not parsed.username
                  data,kind=fetch(url);assert kind.startswith('image/') and data.startswith(b'\xff\xd8')
                  name='emergency-photos/'+digest(url.encode())+'.jpg'
                  (ROOT/name).parent.mkdir(exist_ok=True);(ROOT/name).write_bytes(data);external[url]='/'+name
              def replace(value):
                  if isinstance(value,dict):return {k:replace(v) for k,v in value.items()}
                  if isinstance(value,list):return [replace(v) for v in value]
                  if isinstance(value,str):return external.get(value,value)
                  return value
              # Re-read every route, not just indexes, to detect concurrent edits during the crawl.
              for path,value in routes.items():assert canonical(get(path,database=path in paths and path!='/api/spotify/player'))==canonical(value),'Public data changed during snapshot; retry safely'
              end=get('/__emergency/source.json');assert (end['revision'],end['sha256'])==(source['revision'],source['sha256']),'Production release changed during snapshot'
              routes=replace(routes)
              resources={p.relative_to(ROOT).as_posix():digest(p.read_bytes()) for p in ROOT.rglob('*') if p.is_file()}
              content_hash=digest(canonical({'revision':source['revision'],'routes':routes,'files':resources}))
              previous=None
              try:previous=json.loads(fetch(PAGES+'/emergency-manifest.json',2*1024**2)[0])
              except (urllib.error.URLError,ValueError):pass
              changed=not previous or previous.get('content_hash')!=content_hash or os.environ.get('FORCE_PUBLISH')=='true'
              now=datetime.datetime.now(datetime.timezone.utc).isoformat()
              payload={'created_at':now,'source':SOURCE,'revision':source['revision'],'routes':routes}
              code=r'''(()=>{const DATA=__DATA__;const base=window.location.href;const realFetch=window.fetch.bind(window);const own=u=>u.origin===window.location.origin||u.origin===DATA.source;
          window.fetch=async(input,init)=>{const u=new URL(typeof input==='string'?input:input instanceof URL?input.href:input.url,base);if(own(u)&&u.pathname.startsWith('/api/')){const method=(init?.method||input?.method||'GET').toUpperCase();if(u.pathname==='/api/analytics/events')return new Response(null,{status:204});if(method!=='GET')return new Response('Static emergency site is read only',{status:503});if(Object.prototype.hasOwnProperty.call(DATA.routes,u.pathname))return new Response(JSON.stringify(DATA.routes[u.pathname]),{status:200,headers:{'Content-Type':'application/json'}});return new Response('Unavailable in static snapshot',{status:404});}return realFetch(input,init);};
          if(navigator.sendBeacon){const realBeacon=navigator.sendBeacon.bind(navigator);navigator.sendBeacon=(url,data)=>{const u=new URL(url,base);return own(u)&&u.pathname.startsWith('/api/')?true:realBeacon(url,data);};}
          document.addEventListener('DOMContentLoaded',()=>{const note=document.createElement('div');note.textContent='静态应急入口 · 仅供浏览 · 数据快照 '+DATA.created_at.slice(0,16).replace('T',' ')+' UTC · 版本 '+DATA.revision.slice(0,7);note.style.cssText='position:relative;z-index:2147483647;padding:7px 11px;text-align:center;background:#17223be8;color:#fff;font:12px/1.5 system-ui';document.body.prepend(note);});})();'''.replace('__DATA__',json.dumps(payload,ensure_ascii=False))
              (ROOT/'emergency-data.js').write_text(code,encoding='utf-8')
              html=(ROOT/'index.html').read_text();assert '<head>' in html
              (ROOT/'index.html').write_text(html.replace('<head>','<head>\n<meta name="robots" content="noindex,nofollow"><script src="./emergency-data.js"></script>',1),encoding='utf-8')
              (ROOT/'.nojekyll').write_text('');(ROOT/'robots.txt').write_text('User-agent: *\nDisallow: /\n')
              files={p.relative_to(ROOT).as_posix():digest(p.read_bytes()) for p in ROOT.rglob('*') if p.is_file()}
              assert len(files)<6000 and sum(p.stat().st_size for p in ROOT.rglob('*') if p.is_file())<=256*1024**2
              manifest={'version':2,'public_only':True,'created_at':now,'source_revision':source['revision'],'content_hash':content_hash,'photos':len(routes['/api/photos']),'public_uploaded_files':len(images),'display_photo_archives':len(external),'files':files}
              (ROOT/'emergency-manifest.json').write_text(json.dumps(manifest,indent=2))
              for name,sha in files.items():assert digest((ROOT/name).read_bytes())==sha
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('changed='+str(changed).lower()+'\nrevision='+source['revision']+'\ncontent_hash='+content_hash+'\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f"## Static emergency snapshot\n\nSource: `{source['revision']}` (actually running production).\n\nChecked at: {now}. Files: {len(files)}. Public uploads: {len(images)}. Photos: {len(routes['/api/photos'])}.\n\nContent hash: `{content_hash}`. Publish needed: **{changed}**. All API reads were anonymous; all files validated. Failed checks preserve the prior Pages deployment.\n")
              print(json.dumps({'ok':True,'changed':changed,'revision':source['revision'],'files':len(files),'bytes_downloaded':total}))

          if __name__=='__main__':build()
          PY
      - name: Upload validated snapshot
        if: steps.snapshot.outputs.changed == 'true' && inputs.dry_run != true
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/emergency-site

  deploy:
    if: needs.build.outputs.changed == 'true' && inputs.dry_run != true
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy validated static snapshot
        id: deployment
        uses: actions/deploy-pages@v5
