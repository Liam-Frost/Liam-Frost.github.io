<!doctype html>
<html lang="zh-Hans" data-theme="system" data-lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人主页 & 摄影作品集｜ Portfolio" />

    <title>Hello! This is Liam!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/portrait1.svg"
      type="image/svg+xml"
      fetchpriority="high"
    />

    <link rel="icon" type="image/svg+xml" href="/LOGO2.svg" />

    <script>
      (() => {
        // Nested missing-page URLs must still discover the root application's assets.
        if (
          location.pathname !== "/" &&
          location.pathname !== "/index.html" &&
          !document.querySelector("base")
        ) {
          const base = document.createElement("base");
          base.href = "/";
          document.head.prepend(base);
        }
        const families = {
          zh: "Noto Sans SC",
          "zh-Hant": "Noto Sans SC",
          ja: "Noto Sans JP",
          en: "Inter",
          fr: "Manrope"
        };
        const navLang = (navigator.language || "").toLowerCase();
        let fontLang = navLang.startsWith("fr")
          ? "fr"
          : navLang.startsWith("ja")
            ? "ja"
            : navLang.startsWith("en")
              ? "en"
              : "zh";
        try {
          fontLang = localStorage.getItem("lang") || fontLang;
        } catch {}
        const fontLink = document.createElement("link");
        fontLink.id = "site-language-font";
        fontLink.rel = "stylesheet";
        fontLink.href =
          "https://fonts.googleapis.com/css2?family=" +
          encodeURIComponent(families[fontLang] || families.zh) +
          ":wght@400;600;700;800&display=swap";
        document.head.appendChild(fontLink);
        // The router restores positions through Lenis; native restoration would race it.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        try {
          const savedTheme = localStorage.getItem("theme");
          if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

          const savedLang = localStorage.getItem("lang");
          if (savedLang) {
            document.documentElement.setAttribute("data-lang", savedLang);
            document.documentElement.lang =
              savedLang === "ja"
                ? "ja"
                : savedLang === "fr"
                  ? "fr"
                  : savedLang === "en"
                    ? "en"
                    : "zh-Hans";
          }
        } catch {
          // ignore
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
